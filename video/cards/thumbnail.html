<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IS;src:url("../fonts/InstrumentSerif-Regular.ttf")}
@font-face{font-family:ISI;src:url("../fonts/InstrumentSerif-Italic.ttf")}
@font-face{font-family:AH;src:url("../fonts/AtkinsonHyperlegibleNext.ttf")}
@font-face{font-family:PM;src:url("../fonts/IBMPlexMono-Regular.ttf")}
html,body{margin:0;width:1500px;height:1000px;background:#0d0c0a;color:#efe8da;overflow:hidden}
body{background:radial-gradient(120% 80% at 75% -10%,rgba(255,179,64,.10),transparent 55%),radial-gradient(80% 60% at -10% 110%,rgba(255,106,61,.07),transparent 60%),#0d0c0a;position:relative}
.wrap{position:absolute;inset:90px 100px}
.eyebrow{font:20px PM;letter-spacing:.2em;text-transform:uppercase;color:#938a7b}
h1{font:400 170px/0.92 IS;margin:28px 0 0;letter-spacing:-.01em}
h1 .q{color:#c2b9a8}
h1 .s{position:relative;display:inline-block}
h1 .s:after{content:"";position:absolute;left:-2%;right:-2%;top:56%;height:12px;background:#ff6a3d}
.desc{margin-top:26px;font:italic 46px/1.2 ISI;color:#ffb340;max-width:1180px;text-shadow:0 0 24px rgba(255,179,64,.35)}
.brand{position:absolute;left:100px;bottom:90px;display:flex;align-items:baseline;gap:6px;font:400 64px IS}
.dot{width:16px;height:16px;border-radius:50%;background:#ffb340;box-shadow:0 0 20px rgba(255,179,64,.6);display:inline-block}
.tag{position:absolute;left:100px;bottom:50px;font:24px AH;color:#c2b9a8}
svg{position:absolute;right:100px;bottom:72px}
</style></head><body><div class="wrap">

</body></html>
