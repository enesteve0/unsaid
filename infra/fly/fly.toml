# Fallback host for the Unsaid demo, used only if the Nebius Serverless endpoint is not available.
# Deploy with infra/fly/deploy.sh from the repository root (it passes the app name, region and Dockerfile).
#
# One always-on machine: the run queue lives in the process, and NVIDIA Parakeet needs dedicated CPUs to transcribe
# faster than real time. Runs, uploads and the spend ledger live on the volume, so caps survive restarts.

[env]
  DATA_DIR = "/data"
  DEMO_MODE = "live"
  PROVIDER = "tokenfactory"
  HOST = "Fly.io"

[[mounts]]
  source = "unsaid_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
