name: monitor

# Keeps an eye on the live demo through the judging period (Dec 1-15, 2026). GitHub emails the owner when a run fails.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The demo and its recorded example answer
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -o /dev/null "$DEMO_URL/"
          curl -fsS --max-time 30 "$DEMO_URL/media/samples/manifest.json" | python3 -c 'import json, sys; assert json.load(sys.stdin), "no examples"'
          # A full deployment also has an API: then every Nemotron model must be listed as active.
          if body=$(curl -fsS --max-time 30 "$DEMO_URL/api/health" 2>/dev/null) && echo "$body" | python3 -c 'import json, sys; json.load(sys.stdin)' 2>/dev/null; then
            echo "$body" | python3 -c '
          import json, sys, time
          d = json.load(sys.stdin)
          need = ["nvidia/Nemotron-3.5-Super-VL", "nvidia/Nemotron-3-Ultra-550b-a55b", "nvidia/Nemotron-3_5-Lightning", "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"]
          missing = [m for m in need if d["models"].get(m) not in ("active", None) or m not in d["models"]]
          print("live_status:", d.get("live_status"), "| models checked:", len(d["models"]))
          if time.time() - d.get("models_checked", 0) > 3 * 3600: sys.exit("model list not refreshed for 3 hours")
          if missing: sys.exit("models not active: " + ", ".join(missing))
          '
          else
            echo "static demo: no API to check"
          fi
